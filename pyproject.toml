[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-systemic-risk"
version = "0.1.0"
description = "Retrospective early-warning benchmark for Aave liquidation stress"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ijson==3.4.0.post0",
  "lightgbm==4.6.0",
  "matplotlib==3.10.8",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "pyarrow==21.0.0",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "torch==2.7.1"
]

[tool.setuptools.packages.find]
where = ["src"]
